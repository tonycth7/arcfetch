[package]
name        = "arcfetch"
version     = "1.1.0"
edition = "2021"
description = "Blazing-fast Unix sysinfo"
license = "MIT"
repository = "https://github.com/tonycth7/arcfetch"

[[bin]]
name = "arcfetch"
path = "src/main.rs"

[dependencies]
lexopt = "0.3.2"
libc = "0.2"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
